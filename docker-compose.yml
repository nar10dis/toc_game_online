services:
  backend:
  # A started container is not a ready database: migrate deploy would fail on a fresh volume
    depends_on:
      - postgres
          # - condition: service_healthy
      - logstash
    build: ./backend
    container_name: backend
    env_file:
      - ./backend/.env
    ports:
      - "3001:3001"
      - "51212:51212"
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - docker-network

  frontend:
    build: ./frontend
    container_name: frontend
    env_file:
      - .env
    ports:
      - "3002:3002"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # the build cache stays in the container: on sgoinfre (network disk) next dev hangs
      - /app/.next
    networks:
      - docker-network

  nginx:
    depends_on:
      - frontend
      - backend
      - logstash
    build: ./nginx
    container_name: nginx
    env_file:
      - .env
    ports:
      - "8443:443"
    networks:
      - docker-network

  postgres:
    image: postgres:18.4-alpine3.24
    container_name: postgres
    env_file:
      - .env
    healthcheck:
      # $$ so the variables are read inside the container, not by compose
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - docker-network
    volumes:
      - db_data:/var/lib/postgresql

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - docker-network

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.5
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - docker-network

  logstash:
    build: ./logstash
    container_name: logstash
    environment:
      - LOGSTASH_PASSWORD=${LOGSTASH_PASSWORD}
    depends_on:
    - elasticsearch
    networks:
    - docker-network

  elk:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    container_name: elk-setup
    user: root
    entrypoint: ["/bin/bash", "/setup/setup.sh"]
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD}
      - LOGSTASH_PASSWORD=${LOGSTASH_PASSWORD}
    volumes:
      - ./elk:/setup:ro
    depends_on:
      - elasticsearch
    restart: "no"
    networks:
      - docker-network


networks:
  docker-network:
    driver: bridge

volumes:
  db_data:
  es-data: