filebeat.autodiscover:
  providers:
    - type: docker
      host: unix:///var/run/docker.sock
      hints.enabled: true

      templates:
        - condition:
            contains:
              docker.container.name: nginx
          config:
            - type: filestream
              id: nginx-${data.docker.container.id}
              paths: /var/lib/docker/containers/${data.docker.container.id}/*.log
              parsers:
                - container: ~

        - condition:
            contains:
              docker.container.name: backend
          config:
            - type: filestream
              id: backend-${data.docker.container.id}
              paths: /var/lib/docker/containers/${data.docker.container.id}/*.log
              parsers: 
                - container: ~

output.logstash:
  hosts: ["logstash:5044"]