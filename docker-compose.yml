services:
  backend:
    depends_on:
      - postgres
    build: ./backend
    container_name: backend
    env_file:
      - .env
    ports:
      - "3001:3001"
    networks:
      - docker-network

  frontend:
    build: ./frontend
    container_name: frontend
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - docker-network

  nginx:
    build: ./nginx
    container_name: nginx
    env_file:
      - .env
    ports:
      - "8080:443"
    networks:
      - docker-network

  postgres:
    image: postgres:18.4-alpine3.24
    env_file:
      - .env
    networks:
      - docker-network
    volumes:
      - db_data:/var/lib/postgresql


networks:
  docker-network:
    driver: bridge

volumes:
  db_data:
