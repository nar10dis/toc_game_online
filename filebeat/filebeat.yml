filebeat.autodiscover:
  providers:
    - type: docker
      hints.enabled: true

      templates:
        - condition:
          contains:
            docker.container.name: nginx
          config:
            - type: filestream
              id: ${data.docker.container.id}
              path: etc/nginx/

      templates:
        - condition:
          contains:
            docker.container.name: backend
          config:
            - type: filestream
              id: ${data.docker.container.id}
              path: 




output.logstash:
  hosts: ["logstash:5044"]