input {
  beats {
    port => 5044
  }
}

filter {
  if [container][name] == "nginx" and [stream] == "stdout" {
    json {
    source => "message"
    }
  }
  
  else if [container][name] == "nginx" and [stream] == "stderr" { 
    grok {
      match => {
        "message" => "%{YEAR}/%{MONTHNUM}/%{MONTHDAY} %{TIME} \[%{LOGLEVEL:log_level}\] %{GREEDYDATA:error_message}"
      }
    }
    tag_on_failure => ["_nginx_error_grok_failure"]
  }

  else if [container][name] == "backend" and [stream] == "stdout" {
    json {
        source => "message"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
  }

  stdout { codex => rubydebug }
}