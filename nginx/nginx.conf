
user  nginx;
worker_processes  auto;

error_log  /dev/stderr notice;
error_log  syslog:server=logstash:5140,tag=nginx_error notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format nginx_logs escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"remote_user":"$remote_user",'
        '"status": $status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status"'
    '}';
    
    access_log /dev/stdout nginx_logs;
    access_log syslog:server=logstash:5140,tag=nginx_access nginx_logs;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    server {
            listen 443 ssl;
            listen [::]:443 ssl;

            server_name localhost;

            ssl_certificate /etc/nginx/ssl/nginx.crt;
            #defini cle privee associee au certificat
            ssl_certificate_key /etc/nginx/ssl/nginx.key;
            #Desactive ancien protocoles vulnerables, autorise uniquement
            ssl_protocols TLSv1.2 TLSv1.3;

        location /api/ {
                proxy_pass http://backend:3001;
            }

            location /ws/ {
                proxy_pass http://backend:3001;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
            }

            location / {
            proxy_pass http://frontend:3000;
            }
        } 
}


