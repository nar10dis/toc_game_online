services:
  backend:
    depends_on:
      - postgres
    build: ./backend
    container_name: backend
    env_file:
      - ./backend/.env
    ports:
      - "3001:3001"
      - "51212:51212"
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks: 
      - docker-network

  frontend:
    build: ./frontend
    container_name: frontend
    env_file:
      - .env
    ports:
      - "3002:3002"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks: 
      - docker-network

  nginx: 
    depends_on: 
      - frontend
      - backend
    build: ./nginx
    container_name: nginx
    env_file:
      - .env
    ports:
      - "8443:443"
    networks:
      - docker-network

  postgres:
    image: postgres:18.4-alpine3.24
    env_file:
      - .env
    networks:
      - docker-network
    volumes:
      - db_data:/var/lib/postgresql


networks:
  docker-network:
    driver: bridge

volumes:
  db_data:
