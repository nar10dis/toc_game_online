input {
  syslog {
    port => 5140
    ecs_compatibility => disabled
    add_field => { "service" => "nginx" }
  }
  tcp {
    port => 5000
    codec => json_lines
    add_field => { "service" => "backend" }
  }
}

filter {
  if [service] == "nginx" {
    if [program] == "nginx_access" {
      json { source => "message" }
    } else if [program] == "nginx_error" {
      grok {
        match => { "message" => "(?:%{YEAR}/%{MONTHNUM}/%{MONTHDAY} %{TIME} )?\[%{LOGLEVEL:log_level}\] %{GREEDYDATA:error_message}" }
        tag_on_failure => ["_nginx_error_grok_failure"]
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
    user  => "logstash_internal"
    password => "${LOGSTASH_PASSWORD}"
  }
}